  <text x="100" y="535" fill="#544A3C" font-family="system-ui, sans-serif" font-size="24">App nativa para repartidores - CABA y GBA</text>
  
  <!-- Stamp -->
  <g transform="translate(850, 280) rotate(-8)">
    <rect x="0" y="0" width="220" height="80" fill="none" stroke="#D8401E" stroke-width="4" rx="8"/>
    <rect x="4" y="4" width="212" height="72" fill="none" stroke="#D8401E" stroke-width="2" rx="6"/>
    <text x="110" y="52" fill="#D8401E" font-family="monospace" font-size="24" font-weight="700" text-anchor="middle" letter-spacing="3">EN VIVO</text>
  </g>
  
  <!-- URL -->
