<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Seguí tu envío — Posta</title>
    <meta name="description" content="Consultá el estado y la ubicación en vivo de tu envío de Mercado Libre con Posta." />
    <link rel="icon" type="image/svg+xml" href="/icon-posta.svg" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script>
    (function(){
      var landing=localStorage.getItem('posta-theme');
      var legacy=localStorage.getItem('posta_theme');
      var theme='dark';
      if(landing==='light')theme='paper';
      else if(landing==='dark')theme='dark';
      else if(legacy==='paper'||legacy==='dark')theme=legacy;
      var root=document.documentElement;
      root.setAttribute('data-theme',theme);
      root.classList.toggle('theme-dark',theme==='dark');
      root.classList.toggle('theme-paper',theme==='paper');
    })();
    </script>
  </head>
  <body class="antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/seguimiento.tsx"></script>
  </body>
</html>
