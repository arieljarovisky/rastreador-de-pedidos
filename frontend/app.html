<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Posta | Rastreo de Pedidos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
    />
    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon-posta.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <meta name="theme-color" content="#1c1814" />
    <script>
    (function(){
      var landing=localStorage.getItem('posta-theme');
      var legacy=localStorage.getItem('posta_theme');
      var theme='dark';
      if(landing==='light')theme='paper';
      else if(landing==='dark')theme='dark';
      else if(legacy==='paper'||legacy==='dark')theme=legacy;
      var root=document.documentElement;
      root.setAttribute('data-theme',theme);
      root.classList.toggle('theme-dark',theme==='dark');
      root.classList.toggle('theme-paper',theme==='paper');
      root.classList.toggle('dark',theme==='dark');
      var meta=document.querySelector('meta[name="theme-color"]');
      if(meta) meta.setAttribute('content', theme==='dark' ? '#1c1814' : '#f3f0e8');
    })();
    </script>
    <!-- Apple Mobile Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Posta" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-53NS1Z2TH1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-53NS1Z2TH1', {
        anonymize_ip: true,
        allow_google_signals: false,
        allow_ad_personalization_signals: false
      });
    </script>
  </head>
  <body class="antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
